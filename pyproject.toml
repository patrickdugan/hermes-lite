[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-lite"
version = "0.1.0"
description = "A stripped-down local coding agent CLI with Anthropic-first runtime and optional local model plumbing"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Andy / Hermes Lite" }]
license = { text = "MIT" }
dependencies = [
  "fire",
  "httpx",
  "jinja2",
  "litellm>=1.75.5",
  "mcp>=1.0",
  "platformdirs",
  "psutil>=5.9",
  "prompt_toolkit",
  "pydantic>=2.0",
  "python-dotenv",
  "pyyaml",
  "requests",
  "rich",
  "simple-term-menu",
  "tenacity",
  "typer",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "pytest-timeout"]
research = ["torch>=2.1"]
local = [
  "mlx-vlm>=0.3.12",
  "starlette",
  "uvicorn",
]

[project.scripts]
hermes-lite = "hermes_cli.main:main"
hermes-lite-agent = "run_agent:main"
hermes-lite-serve = "local_models.serve:main"
hermes-lite-mcp-lab = "agent.mcp_trm_ldt_lab:main"
hermes-lite-int3-lab = "agent.intellect3_logic_lab:main"
hermes-lite-int3-mcp = "agent.intellect3_logic_mcp:main"
hermes-lite-ultra-lean-skills = "agent.ultra_lean_skill_lab:main"
hermes-lite-lean = "agent.lean_cli:main"
hermes-lite-filesystem-mcp = "agent.lean_filesystem_mcp:main"

[tool.setuptools]
py-modules = ["run_agent", "model_tools", "toolsets", "cli", "hermes_constants", "hermes_state", "utils"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent*", "hermes_cli*", "local_models*", "tools*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: marks tests requiring external services",
  "prodpush: production validation tests requiring live API keys",
]
addopts = "-m 'not integration and not prodpush'"
asyncio_mode = "auto"
